<!doctype html>
<html lang="en" class="h-full preload" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title data-i18n="main.title">Landtaker (ALPHA)</title>
    <link rel="manifest" href="<%- manifestHref %>" />
    <link rel="icon" type="image/svg+xml" href="<%- faviconHref %>" />

    <!-- Preload styles -->
    <style>
      .preload {
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.5s ease-out;
      }

      /* iOS safe area support */
      body {
        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
      }

      /* Prevent Playwire bottom rail from affecting flex layout,
         and keep it below the bottom HUD (z-[200]) so it can't cover the control panel */
      [id^="pw-oop-bottom_rail"] {
        position: fixed !important;
        z-index: 150 !important;
      }

      /* Google Funding Choices CCPA link override */
      .fc-dns-link,
      .fc-ccpa-root,
      .fc-consent-root {
        position: fixed !important;
        z-index: 999999 !important;
      }
      .fc-dns-link {
        bottom: 15px !important;
        left: 15px !important;
      }

      /* Ensure full viewport height on iOS */
      html,
      body {
        height: 100%;
        height: -webkit-fill-available;
        min-height: 100%;
        min-height: -webkit-fill-available;
      }
    </style>

    <!-- SEO -->
    <link rel="canonical" href="https://openfront.io/" />
    <meta
      name="description"
      content="Conquer the world in this multiplayer battle royale! Expand your nation, eliminate opponents, and dominate the map in this fast-paced IO game."
    />

    <!-- Open Graph -->
    <meta property="og:url" content="https://openfront.io/" />
    <meta property="og:title" content="OpenFront - Battle Royale" />
    <meta
      property="og:description"
      content="Conquer the world in this multiplayer battle royale! Expand your nation, eliminate opponents, and dominate the map in this fast-paced IO game."
    />
    <meta property="og:image" content="<%- gameplayScreenshotUrl %>" />
    <meta property="og:type" content="game" />

    <!-- Injected from Server env -->
    <script>
      window.BOOTSTRAP_CONFIG = {
        gitCommit: <%- gitCommit %>,
        assetManifest: <%- assetManifest %>,
        cdnBase: <%- cdnBase %>,
        gameEnv: <%- gameEnv %>,
        numWorkers: <%- numWorkers %>,
        turnstileSiteKey: <%- turnstileSiteKey %>,
        jwtAudience: <%- jwtAudience %>,
        instanceId: <%- instanceId %>,<%- typeof serverHost !== "undefined" && serverHost ? "\n        serverHost: " + serverHost + "," : "" %>
      };
      document.documentElement.style.setProperty(
        "--background-image-url",
        `url("<%- backgroundImageUrl %>")`,
      );
      // document.documentElement.style.setProperty(
      //   "--desktop-logo-image-url",
      //   `url("<%- desktopLogoImageUrl %>")`,
      // );
      document.documentElement.style.setProperty(
        "--mobile-logo-image-url",
        `url("<%- mobileLogoImageUrl %>")`,
      );
    </script>

    <!-- CrazyGames SDK -->
    <script
      src="https://sdk.crazygames.com/crazygames-sdk-v3.js"
      async
    ></script>

    <!-- Cloudflare Turnstile -->
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js"
      async
      defer
    ></script>

    <!-- Ads (Playwire/Ramp + Google Publisher Tag) removed.
         Re-add our own ad stack here when the time comes. -->

    <!-- Analytics removed (was: Google Ads AW-16702609763 + GA4 G-WQGQQ8RDN4).
         Re-add our own analytics snippet here when the time comes.
         Note: src/client/Main.ts declares an optional `window.gtag` and calls it
         defensively, so its absence is safe. -->
  </head>

  <body
    class="h-full select-none font-sans min-h-screen bg-lt-900 transition-opacity duration-300 ease-in-out flex flex-row overflow-hidden"
  >
    <!-- Backdrop, 1:1 with docs/design/mockups/home.html: the terrain map
         desaturated to a trace of its own colour, a faint 96px graticule so it
         reads as cartography rather than a photo, and a veil that darkens the
         edges so edge-anchored UI always has contrast under it. No watermark
         layers — the hero carries the mark. -->
    <div id="hex-grid" class="fixed inset-0 -z-50 pointer-events-none">
      <div
        id="background-layer"
        class="absolute -inset-[3%] bg-cover bg-no-repeat opacity-90 [filter:grayscale(0.82)_contrast(1.3)_brightness(0.62)_sepia(0.15)]"
        style="
          background-image: var(--background-image-url);
          background-position: 62% 30%;
          background-color: #0d1013;
        "
      ></div>
      <div
        class="absolute inset-0 opacity-50"
        style="
          background-image:
            linear-gradient(rgba(232, 236, 239, 0.05) 1px, transparent 1px),
            linear-gradient(
              90deg,
              rgba(232, 236, 239, 0.05) 1px,
              transparent 1px
            );
          background-size: 96px 96px;
        "
      ></div>
      <div
        class="absolute inset-0"
        style="
          background:
            linear-gradient(
              180deg,
              rgba(13, 16, 19, 0.78) 0%,
              rgba(13, 16, 19, 0.55) 30%,
              rgba(13, 16, 19, 0.9) 78%,
              #0d1013 100%
            ),
            linear-gradient(
              90deg,
              #0d1013 2%,
              rgba(13, 16, 19, 0.88) 26%,
              rgba(13, 16, 19, 0.42) 62%,
              rgba(13, 16, 19, 0.78) 100%
            );
        "
      ></div>
    </div>

    <!-- LEFT SIDEBAR MENU -->

    <div
      id="mobile-menu-backdrop"
      class="lg:hidden! in-[.in-game]:hidden hidden pointer-events-none [&.open]:block [&.open]:pointer-events-auto [&.open]:fixed [&.open]:inset-0 [&.open]:bg-black/60 [&.open]:z-[40000] transition-opacity"
      role="presentation"
      aria-hidden="true"
    ></div>

    <mobile-nav-bar
      id="sidebar-menu"
      class="peer [.in-game_&]:hidden z-[40001] fixed left-0 top-0 h-full flex flex-col justify-start overflow-visible bg-black/70 backdrop-blur-xl border-r border-white/10 transition-transform duration-500 ease-out transform -translate-x-full w-[70%] [&.open]:translate-x-0 lg:hidden"
      role="dialog"
      data-i18n-aria-label="main.menu"
    ></mobile-nav-bar>

    <!-- MAIN CONTENT AREA -->
    <div
      class="in-[.in-game]:hidden flex-1 relative overflow-hidden h-full transition-[margin] duration-500 ease-out will-change-[margin-left] flex flex-col"
    >
      <div
        id="turnstile-container"
        class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-99999"
      ></div>

      <homepage-promos></homepage-promos>
      <banned-modal></banned-modal>
      <marketing-consent-toast></marketing-consent-toast>

      <!-- The shell: nav AND content live inside one centred column, as in
           the mock — the chrome is inset, never edge-to-edge. -->
      <div
        class="w-full max-w-[1300px] mx-auto lg:px-7 flex-1 min-h-0 flex flex-col"
      >
        <!-- Desktop Top Bar -->
        <desktop-nav-bar></desktop-nav-bar>

        <!-- Main container with responsive padding -->
        <main-layout class="contents">
          <play-page class="contents"></play-page>
          <matchmaking-modal
            id="page-matchmaking"
            inline
            class="hidden w-full h-full page-content relative z-50"
          ></matchmaking-modal>
          <news-modal
            id="page-news"
            inline
            class="hidden w-full h-full page-content relative z-50"
          ></news-modal>
          <single-player-modal
            id="page-single-player"
            inline
            class="hidden w-full h-full page-content relative z-50"
          ></single-player-modal>
          <host-lobby-modal
            id="page-host-lobby"
            inline
            class="hidden w-full h-full page-content relative z-50"
          ></host-lobby-modal>
          <join-lobby-modal
            id="page-join-lobby"
            inline
            class="hidden w-full h-full page-content relative z-50"
          ></join-lobby-modal>
          <store-modal
            id="page-item-store"
            inline
            class="hidden w-full h-full page-content relative z-50"
          ></store-modal>
          <admin-modal
            id="page-admin"
            inline
            class="hidden w-full h-full page-content relative z-50"
          ></admin-modal>
          <user-setting
            id="page-settings"
            inline
            class="hidden w-full h-full page-content relative z-50"
          ></user-setting>
          <leaderboard-modal
            id="page-leaderboard"
            inline
            class="hidden w-full h-full page-content relative z-50"
          ></leaderboard-modal>
          <troubleshooting-modal
            id="page-troubleshooting"
            inline
            class="hidden w-full h-full page-content relative z-50"
          ></troubleshooting-modal>

          <clan-modal
            id="page-clan"
            inline
            class="hidden w-full h-full page-content relative z-50"
          ></clan-modal>
          <account-modal
            id="page-account"
            inline
            class="hidden w-full h-full page-content relative z-50"
          ></account-modal>
          <game-stats-modal
            id="page-stats"
            inline
            class="hidden w-full h-full page-content relative z-50"
          ></game-stats-modal>
          <game-history-page
            id="page-history"
            inline
            class="hidden w-full h-full page-content relative z-50"
          ></game-history-page>
          <player-profile-modal
            id="page-profile"
            inline
            class="hidden w-full h-full page-content relative z-50"
          ></player-profile-modal>
          <help-modal
            id="page-help"
            inline
            class="hidden w-full h-full page-content relative z-50"
          ></help-modal>
          <language-modal
            id="page-language"
            inline
            class="hidden w-full h-full page-content relative z-50"
          ></language-modal>
          <flag-input-modal
            id="flag-input-modal"
            inline
            class="hidden w-full h-full page-content relative z-50"
          ></flag-input-modal>
          <cosmetics-modal
            id="cosmetics-modal"
            inline
            class="hidden w-full h-full page-content relative z-50"
          ></cosmetics-modal>
          <ranked-modal
            id="page-ranked"
            inline
            class="hidden w-full h-full page-content relative z-50"
          ></ranked-modal>
          <party-modal
            id="page-party"
            inline
            class="hidden w-full h-full page-content relative z-50"
          ></party-modal>
        </main-layout>
      </div>

      <div class="[.in-game_&]:hidden mt-auto flex flex-col shrink-0">
        <page-footer></page-footer>
      </div>

      <!-- Global Modals -->
      <steam-link-modal></steam-link-modal>
    </div>

    <!-- Game components -->
    <div id="app"></div>

    <!-- Bottom HUD: <sm=column, sm..lg=2col (HUD left | events right), lg+=3col grid centered -->
    <div
      class="fixed bottom-0 left-0 w-full z-[200] flex flex-col pointer-events-none sm:flex-row sm:items-end lg:grid lg:grid-cols-[1fr_minmax(0,760px)_1fr] lg:items-end min-[1200px]:px-4"
      style="
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      "
    >
      <!-- HUD: <sm contents (children join outer flex), sm+ flex-col 760px, lg+ col-2.
           Mock's bb: rate/troops/gold, attack ratio, build rail — one slab. -->
      <div
        class="contents sm:flex sm:flex-col sm:pointer-events-none w-full sm:w-[min(760px,100%)] lg:col-start-2 sm:z-10 sm:mx-auto"
      >
        <attacks-display
          class="w-full pointer-events-auto order-1 sm:order-none"
        ></attacks-display>
        <div
          class="pointer-events-auto bg-[rgb(11_14_17/0.94)] border border-lt-700 backdrop-blur-md order-3 sm:order-none"
        >
          <control-panel class="w-full"></control-panel>
          <unit-display class="hidden lg:block w-full"></unit-display>
        </div>
      </div>

      <!-- chat: <sm between attacks and control (order-2), sm+ right side, lg+ col-3.
           The event feed itself lives top-right, under the game controls. -->
      <div
        class="flex flex-col pointer-events-none items-end order-2 sm:order-none sm:flex-1 lg:col-start-3 lg:self-end lg:justify-end"
      >
        <chat-display
          class="w-full sm:w-auto pointer-events-auto"
        ></chat-display>
        <!-- On desktop the feed detaches and pins top-right under the game
             controls, as in the mock; on mobile it stays in this column. -->
        <div
          class="contents lg:flex lg:flex-col lg:gap-1 lg:fixed lg:right-0 lg:top-[56px] min-[1200px]:right-4 min-[1200px]:top-[68px] lg:z-[900] lg:items-end lg:max-h-[calc(100vh-190px)]"
        >
          <events-display
            class="w-full sm:w-auto pointer-events-auto lg:min-h-0"
          ></events-display>
          <actionable-events
            class="w-full sm:w-auto pointer-events-auto"
          ></actionable-events>
        </div>
      </div>
    </div>

    <!-- Game modals and overlays -->
    <emoji-table></emoji-table>
    <phone-widget></phone-widget>
    <!-- Renders nothing unless the account holds an admin role. The server
         refuses the cheats regardless, so this is not a security boundary. -->
    <admin-cheat-menu></admin-cheat-menu>
    <build-menu></build-menu>
    <win-modal></win-modal>
    <new-lobby-prompt></new-lobby-prompt>
    <game-starting-modal></game-starting-modal>
    <div
      class="flex flex-col items-end fixed top-0 right-0 min-[1200px]:top-4 min-[1200px]:right-4 z-1000 gap-2"
    >
      <game-right-sidebar></game-right-sidebar>
      <replay-panel></replay-panel>
    </div>
    <settings-modal></settings-modal>
    <graphics-settings-modal></graphics-settings-modal>
    <player-panel></player-panel>
    <spawn-timer></spawn-timer>
    <immunity-timer></immunity-timer>
    <in-game-promo></in-game-promo>
    <alert-frame></alert-frame>
    <chat-modal></chat-modal>
    <multi-tab-modal></multi-tab-modal>
    <game-left-sidebar></game-left-sidebar>
    <performance-overlay></performance-overlay>
    <player-info-overlay></player-info-overlay>
    <heads-up-message></heads-up-message>

    <!-- Friends dock: bottom-right on every main-menu page, hidden in game.
         A direct <body> child so it survives page switches. -->
    <friends-panel></friends-panel>

    <!-- Featured stream: direct <body> child (NOT inside the in-[.in-game]:hidden
         home container) so the Twitch iframe is never display:none'd during a game,
         which would unmount the player and break ToS-compliant playback. The
         component is position:fixed and self-manages visibility (pauses in-game). -->
    <featured-stream></featured-stream>

    <!-- Scripts -->
    <script>
      // Remove preload class after everything is loaded
      window.addEventListener("load", function () {
        requestAnimationFrame(() => {
          document.documentElement.classList.remove("preload");
        });
      });

      // Fallback: remove preload class after timeout in case DOMContentLoaded never fires
      setTimeout(function () {
        document.documentElement.classList.remove("preload");
      }, 3000);
    </script>

    <script>
      // Fallback sidebar toggle so hamburger works even if module bundle fails to load
      window.__toggleSidebar = function (e) {
        try {
          const sidebar = document.getElementById("sidebar-menu");
          const backdrop = document.getElementById("mobile-menu-backdrop");
          if (!sidebar || !backdrop) return;

          const isOpen = sidebar.classList.contains("open");

          if (isOpen) {
            sidebar.classList.remove("open");
            backdrop.classList.remove("open");
            document.documentElement.classList.remove("overflow-hidden");
            sidebar.setAttribute("aria-hidden", "true");
            sidebar.removeAttribute("aria-modal");
            backdrop.setAttribute("aria-hidden", "true");
          } else {
            sidebar.classList.add("open");
            backdrop.classList.add("open");
            document.documentElement.classList.add("overflow-hidden");
            sidebar.setAttribute("aria-hidden", "false");
            sidebar.setAttribute("aria-modal", "true");
            backdrop.setAttribute("aria-hidden", "false");
          }

          const hb = document.getElementById("hamburger-btn");
          if (hb) hb.setAttribute("aria-expanded", (!isOpen).toString());
        } catch (err) {
          console.error("Toggle failed", err);
        }
      };

      // Wire up the hamburger button inline
      const hamburger = document.getElementById("hamburger-btn");
      if (hamburger) {
        hamburger.onclick = window.__toggleSidebar;
        hamburger.setAttribute("aria-expanded", "false");
      }

      // Wire up backdrop click to close menu
      const backdrop = document.getElementById("mobile-menu-backdrop");
      if (backdrop) {
        backdrop.onclick = function (e) {
          const sidebar = document.getElementById("sidebar-menu");
          if (sidebar && sidebar.classList.contains("open")) {
            window.__toggleSidebar(e);
          }
        };
      }

      // Wire up Escape key to close menu
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" || e.key === "Esc") {
          const sidebar = document.getElementById("sidebar-menu");
          if (sidebar && sidebar.classList.contains("open")) {
            window.__toggleSidebar(e);
          }
        }
      });
    </script>

    <!-- Analytics removed (was: Cloudflare Web Analytics beacon).
         Re-add our own analytics beacon here when the time comes. -->
    <script type="module" src="/src/client/Main.ts"></script>
    <!-- Ads removed (was: Playwire/Ramp loader in <footer>). -->
  </body>
</html>
