# Landtaker production stack for Coolify (Docker Compose resource).
#
# One stack, five services. Point a Coolify "Docker Compose" resource at this
# file; set the environment variables in Coolify's UI (they land in every
# service below via ${...}); attach domains in Coolify:
#
#   game    -> https://<DOMAIN>          (port 80)
#   backend -> https://api.<DOMAIN>      (port 8787)
#
# The api. subdomain is NOT a choice: both the client and the game server
# derive the API base as https://api.<DOMAIN> from the JWT audience
# (src/client/Api.ts getApiBase, src/server/ServerEnv.ts jwtIssuer).
#
# postgres/redis stay internal — no domains, no published ports. The postgres
# volume is what survives deploys; see docs/DEPLOY.md for the rollout story.
#
# coturn (the TURN relay for the in-game phone) also has no domain — it uses
# network_mode: host and is reached directly by IP:port. See its own comment
# below and docs/PhoneTurn.md.
services:
  game:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    # Coolify/Traefik route to the exposed container port; nginx listens on 80.
    expose:
      - "80"
    environment:
      GAME_ENV: prod
      DOMAIN: ${DOMAIN}
      SUBDOMAIN: main
      NUM_WORKERS: ${NUM_WORKERS:-2}
      API_KEY: ${API_KEY}
      ADMIN_BOT_API_KEY: ${ADMIN_BOT_API_KEY}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-production}
      PORT: 8787
      DATABASE_URL: postgres://openfront:${POSTGRES_PASSWORD}@postgres:5432/openfront
      REDIS_URL: redis://redis:6379
      JWT_ISSUER: https://api.${DOMAIN}
      JWT_AUDIENCE: ${DOMAIN}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      API_KEY: ${API_KEY}
      CORS_ORIGIN: https://${DOMAIN}
      # Shared secret with the coturn service below (same var, same value —
      # see coturn's `static-auth-secret`). Lets the backend mint short-lived
      # TURN credentials (coturn's REST API scheme) without ever handing the
      # browser the long-lived secret. Absent => /phone/turn-credentials
      # answers STUN-only (see backend/src/services/turnCredentials.ts).
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:-}
      # Public turn: URL(s) the client dials with the minted credential, e.g.
      # turn:yourdomain.tld:3478. Comma-separated if you expose more than one
      # (e.g. add turns:yourdomain.tld:5349 once you terminate TLS on 5349).
      TURN_URLS: ${TURN_URLS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openfront
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: openfront
    volumes:
      # THE stateful piece. Deploys rebuild containers; this volume persists.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfront -d openfront"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Presence, party fanout and matchmaking state are ephemeral by design —
    # a restart drops players to the lobby, which is recoverable. No disk.
    command: redis-server --save "" --appendonly no

  # Self-hosted TURN relay for the in-game phone (WebRTC). Replaces a hosted
  # TURN provider — see docs/PhoneTurn.md for the full story and how to
  # verify it's working.
  #
  # network_mode: host, not Coolify/Traefik routing. TURN needs the caller to
  # reach a large *UDP* port range (the relay ports below) plus the fixed
  # listener port, and Docker's per-port NAT mapping does not forward that
  # reliably (coturn also needs to see the real client source port to relay
  # correctly). Host networking sidesteps both problems at the cost of
  # binding directly to the host's network stack — this is the standard
  # coturn deployment shape, not an OpenFront-specific hack.
  #
  # ############################################################
  # # TURN_EXTERNAL_IP IS REQUIRED — relay is silently useless #
  # # without it. Do not deploy this service without setting   #
  # # it in Coolify.                                           #
  # ############################################################
  #
  # coturn advertises whatever address it *sees itself* as the relay
  # (`typ relay`) candidate address it hands back to clients. Without
  # --external-ip, that's whatever address the container's own network
  # stack reports locally — which is fine on a host with exactly one
  # public NIC and no NAT in front of it, but wrong the moment the box
  # sits behind any cloud/provider NAT (nearly all VPS hosts, including
  # Coolify's typical targets). The symptom is exactly the trap this var
  # exists to prevent: signaling succeeds, STUN/host candidates flow, the
  # backend happily reports `TURN=present` because it only checks that a
  # credential was minted — but ICE never produces a single `relay`
  # candidate, so any call that actually needs the relay (strict/symmetric
  # NAT on both ends) goes `connecting -> failed` with no error anywhere
  # that says why. There is no safe default here, so there is no fallback
  # value — the var must be set explicitly to the box's real public IP.
  #
  # Set TURN_EXTERNAL_IP to this server's public IP in Coolify (example:
  # 62.238.60.89 — replace with whatever `curl -4 ifconfig.me` on the host
  # actually returns; do not copy this example value into a real deploy).
  #
  # Format: plain --external-ip=<public-ip> (no PUBLIC/PRIVATE pair) is
  # correct here. The PUBLIC/PRIVATE form exists for boxes where coturn's
  # listening interface sees a *different* private address than the one
  # the internet uses to reach it (classic Docker bridge networking, or a
  # cloud instance with a distinct internal IP coturn would otherwise
  # report). With network_mode: host, coturn binds the host's real network
  # stack directly — there is no separate private-facing address to
  # split out, so the single-IP form is both correct and simpler.
  #
  # Firewall: the host must have these open (UDP unless noted):
  #   3478       TURN listener (also TCP, for the rare TCP-relay fallback)
  #   49160-49200 relay ports (see min/max-port below)
  # An open TCP 3478 alone is NOT sufficient — UDP is what actually
  # carries relayed media; TCP 3478 only carries the rare TCP-relay
  # fallback. See docs/PhoneTurn.md for the full firewall + verification
  # story.
  # Coolify's own reverse proxy plays no role here — this service has no
  # domain attached and is reached directly by IP:port from players' browsers.
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      # Long-term credential mechanism with a shared static secret, NOT
      # lt-cred-mech with a fixed username/password. This is what lets the
      # backend mint short-lived, per-call credentials (coturn's REST API
      # scheme: username is "<expiry>:<id>", password is
      # HMAC-SHA1(username, secret)) instead of shipping one permanent
      # credential to every browser forever.
      - --use-auth-secret
      - --static-auth-secret=${TURN_STATIC_AUTH_SECRET}
      - --realm=${DOMAIN}
      # REQUIRED for relay to work at all — see the box comment above.
      # Without this, coturn allocates relay candidates at whatever
      # address it sees locally, which is unreachable from the public
      # internet on almost any NAT'd/cloud host. No default: an empty
      # value here is a broken deploy, not a degraded one, and should
      # fail loudly (coturn refuses to start on a malformed --external-ip)
      # rather than silently falling back to a useless local address.
      - --external-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP must be set to this server's public IP — see comment above; relay will not work without it}
      # --listening-ip is intentionally NOT set. With network_mode: host,
      # coturn's default (listen on all interfaces) is correct: it needs
      # to accept the STUN/TURN listener on whatever interface the box's
      # public IP resolves to, and there's no second/internal interface
      # here to disambiguate between (see the PUBLIC/PRIVATE note above —
      # that split doesn't apply under host networking). Pin
      # --listening-ip only if this host ever gains multiple NICs and
      # coturn needs to be told which one to bind.
      # Relay port range kept deliberately narrow (41 ports) so the UDP
      # firewall rule above stays a single small range instead of the
      # 49152-65535 IANA default — widen only if you're routinely hitting
      # concurrent-call limits.
      - --min-port=49160
      - --max-port=49200
      # Lock the relay down: it must be usable only as a TURN relay for this
      # game's players, never as a stepping stone into the host's own network
      # or as a free open relay for anyone who finds the port. An
      # unprotected/misconfigured TURN server gets discovered and abused
      # within days of being exposed.
      - --no-multicast-peers
      - --no-cli
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.0.0.0-192.0.0.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=198.18.0.0-198.19.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

volumes:
  postgres-data:
